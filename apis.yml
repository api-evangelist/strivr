aid: strivr
name: Strivr
description: 'Strivr is an enterprise frontline-work platform founded in 2015 out of Stanford University''s
  Virtual Human Interaction Lab by Derek Belch. It began as immersive VR workforce training deployed at
  scale by Walmart, Bank of America and Verizon, and has since become an AI-native "Frontline Intelligence"
  layer that trains custom Visual Language Models on real-world workflows to detect, correct and guide
  task execution in real time through smart glasses. Its public developer surface is the Strivr SDK for
  Unity, which links a Unity project to a project in the Strivr Portal and streams experience, custom-event
  and gaze-tracking telemetry into Strivr''s performance analytics. Strivr publishes no OpenAPI, GraphQL
  SDL or Postman collection; the REST host api.strivr.com answers 401 WWW-Authenticate: Bearer on every
  path.'
