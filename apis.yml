apis:
- aid: strivr:strivr-unity-sdk
  name: Strivr SDK for Unity
  description: The Strivr Software Development Kit for Unity makes Unity projects compatible with the
    Strivr Player in-headset software and with the Strivr Portal. It is used to create and score experiences,
    track custom events with typed parameters, and capture gaze and object-focus telemetry, which is streamed
    to the linked project in the Strivr Portal for usage and performance analytics. Distributed as the
    Unity package com.strivr.strivrsdk from the Developer Dashboard in the Strivr Portal; supports Unity
    2020.3-2022.3 on Pico Neo 3, Meta Quest and HTC XR Elite headsets.
  humanURL: https://developer.strivr.com/docs/sdk/latest/index.html
