  fields: []
- name: Application
  description: The built APK uploaded to Strivr, containing one or more Experiences.
  fields: []
  constraint: Experiences must not be added or removed after first upload or data tracking breaks.
- name: Experience
  description: The unit across which Strivr aggregates and tracks metrics for a training session. Created
