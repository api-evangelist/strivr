entities:
- name: Organization
  description: The customer company. Strivr provisions SSO per organization.
  fields: []
  note: Named only indirectly - "contact Strivr with a list of users that require access at your company".
- name: Project
  description: A Strivr Portal project, created on the Developer Dashboard, that a Unity project is linked
