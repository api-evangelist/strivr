domain_standard_finding: 'Strivr operates in enterprise learning/workforce training, a market with real
  interoperability standards (xAPI, cmi5, SCORM, Caliper). Strivr conforms to none of them in its public
  contract: learner telemetry is captured through a proprietary Unity event API and lands only in the
  Strivr Portal. A buyer who already speaks xAPI and expects to route Strivr experience data into an existing
  LRS needs a bespoke connector. This is recorded as a finding, not a penalty.'
